# feature_min_lag:
#   type: int 
#   low: 1
#   high: 2
#   log: False 
#   step: 1
feature_max_lag:
  type: int 
  low: 2 # 3
  high: 6
  log: False
  step: 1
use_location_dummies:
  values: [true, false]
rf_target_lags:
  type: int
  low: 0
  high: 6
  log: False
  step: 1
arima_order:
  values:
    - [0, 1, 0]
    - [0, 1, 1]
    - [0, 1, 2]
    - [1, 1, 0]
    - [1, 1, 1]
    - [2, 1, 0]
    - [2, 1, 1]
residual_variance_scale:
  type: float
  low: 0.0
  high: 1.5
  log: False
  step: 0.1
# rf_n_estimators: # larger the better at linear cost
#   type: int
#   low: 100
#   high: 500
#   log: False
#   step: 50
rf_max_depth:
  values: [null, 6, 10]
rf_min_samples_leaf:
  type: int
  low: 1
  high: 10
  log: False
  step: 1
rf_max_features:
  values: ["sqrt", 0.3, 0.5, 1.0] # ["sqrt", "log2", 0.3, 0.5, 0.75, 1.0]


