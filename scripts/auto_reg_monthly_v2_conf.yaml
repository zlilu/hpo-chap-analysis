#   type: int
#   low: 150
#   high: 800
#   log: False
# context_length:
#   values: [12, 24, 36, 48, 60]
# n_ensemble: 
#   values: [1] # check if this is converted to int or str
# learning_rate: 
#   type: float 
#   low: 0.0001
#   high: 0.003
#   log: True
# prediction_length: 
#   # type: int
#   # low: 1 
#   # high: 3
#   values: [3]
# cell:
#   values: [gru, simple]
# rnn_features: 
#   values: [8, 16, 32, 64]
# head_features:
#   values: [8, 16, 32, 64]
# rnn_layers:
#   values: [1, 2, 3]
# recursive_decode:
#   values: [false, true]
# dropout_rate:
#   type: float
#   low: 0.0
#   high: 0.4



n_iter:
  type: int
  low: 200
  high: 600
  log: False
  step: 50
early_stopping:
  values: [true]
# hmmmm
validation_periods:
  values: [12, 24, 36]
patience:
  type: int
  low: 3
  high: 10
  log: False
  step: 1
eval_every:
  values: [5, 10]
context_length:
  values: [12, 24, 36, 48]
# n_ensemble: [1, 3, 5] can make a 100-trial run expensive. If runtime matters, I would fix it to [1] during the main random/TPE search, then reevaluate the best 5–10 configurations with n_ensemble: 5; that allocates substantially more of the budget to architecture and optimization rather than repeatedly paying for ensemble replication
n_ensemble:
  values: [1, 3, 5]
learning_rate:
  type: float
  low: 0.00001
  high: 0.003
  log: True
cell:
  values: [gru, simple]
rnn_features:
  values: [8, 16, 32, 64]
head_features:
  values: [8, 16, 24, 32, 48, 64]
rnn_layers:
  values: [1, 2, 3]
recursive_decode:
  values: [false, true]
dropout_rate:
  type: float
  low: 0.0
  high: 0.5
  log: False
  step: 0.05

